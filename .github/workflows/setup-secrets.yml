name: Setup Repository Secrets

on:
  workflow_dispatch:
    inputs:
      sa_password:
        description: 'SQL Server SA password to create as MSSQL_SA_PASSWORD'
        required: true
        type: string

jobs:
  create-secret:
    name: Create MSSQL secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm ci
        working-directory: server
      - name: Create MSSQL_SA_PASSWORD secret
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_SETUP_PAT }}
        run: |
          if [ -z "${GITHUB_PAT}" ]; then
            echo "ERROR: secrets.GITHUB_SETUP_PAT is not set. Create a repo secret named GITHUB_SETUP_PAT containing a PAT with repo scope." >&2
            exit 1
          fi
          node server/scripts/create_github_secret.js "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "MSSQL_SA_PASSWORD" "${{ github.event.inputs.sa_password }}" "${GITHUB_PAT}"
