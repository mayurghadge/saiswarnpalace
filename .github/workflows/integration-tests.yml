name: Integration Tests

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          ACCEPT_EULA: 'Y'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -lc 'apt-get update >/dev/null 2>&1 || true; /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $SA_PASSWORD -Q \"SELECT 1\"'"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Run npm audit (server)
        run: npm run audit
        working-directory: server
      - name: Run integration tests
        env:
          DB_SERVER: mssql
          DB_USER: sa
          DB_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          DB_PORT: 1433
          JWT_SECRET: integration-secret
          TEST_DB_NAME: SaiSwarnTest
        run: npm run test:integration:ci
        working-directory: server
